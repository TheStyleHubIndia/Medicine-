name: Deploy Medicine to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "https://fgsmqccesuxxhitosztc.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_SWNfPQVmoVJWdeJfN6tN1w_TE6NF7eN"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean generated build artifacts
        run: rm -rf .output .wrangler dist

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Supabase build environment
        run: |
          set -eu
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          echo "Supabase URL configured: $VITE_SUPABASE_URL"
          echo "Supabase publishable key configured: yes"

      - name: Verify production source branding
        run: |
          set -eu
          if grep -RniE 'lovable(\.dev| ai)?|made with lovable' src public index.html metadata.json 2>/dev/null; then
            echo "Forbidden Lovable branding found in production source."
            exit 1
          fi
          echo "Production source branding check: PASS"
      
      - name: Build static GitHub Pages output
        run: npx vite build -c vite.config.pages.ts

      - name: Prepare GitHub Pages SPA output
        run: |
          set -eux
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll
          # GitHub Pages serves this repository under /Medicine-/.
          # Normalize any root-absolute Vite asset references so the browser
          # never requests them from the domain root.
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/client/index.html")
          s = p.read_text(encoding="utf-8")
          for prefix in ('src="/assets/', 'href="/assets/'):
              s = s.replace(prefix, prefix.replace('="/', '="/Medicine-/'))
          s = s.replace('href="/favicon.ico"', 'href="/Medicine-/favicon.ico"')
          s = s.replace('href="/manifest.webmanifest"', 'href="/Medicine-/manifest.webmanifest"')
          p.write_text(s, encoding="utf-8")
          Path("dist/client/404.html").write_text(s, encoding="utf-8")
          PY
          grep -Eo '(<script[^>]+src|<link[^>]+href)="[^"]+"' dist/client/index.html | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
